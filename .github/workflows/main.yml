name: JJFO Daily News Bulletin

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (UTC+5:30)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  send-bulletin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python scraper.py

      - name: Commit updated competitors.csv if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitors.csv .last_competitor_discovery || true
          git diff --staged --quiet || git commit -m "chore: update competitor list [skip ci]"
          git push || true
